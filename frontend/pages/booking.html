<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จองเรือ · โบ๊ทลี่</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="container navbar"><a class="brand" href="/"><span class="brand-mark">⌁</span> boatly</a><nav class="navlinks"><a href="/pages/history.html">ประวัติการจอง</a></nav><a class="button secondary small" href="/pages/search.html">ยกเลิก</a></header><section class="page-hero"><div class="container"><span class="eyebrow">กรอกข้อมูลเพื่อจองเรือ</span><h1 class="page-title">ข้อมูลการจอง</h1><p>กรอกข้อมูลผู้จองเพื่อยืนยันรายการได้เลย</p></div></section><main class="container page-main"><div class="content-grid"><form id="booking-form" class="panel"><h2>ข้อมูลผู้จอง</h2><div id="booking-error"></div><div class="form-grid"><label class="field"><span>ชื่อผู้จอง</span><input name="bookerName" autocomplete="name" required maxlength="120" placeholder="กรอกชื่อและนามสกุล"></label><label class="field"><span>เบอร์โทรศัพท์</span><input name="phone" type="tel" autocomplete="tel" required pattern="\+?[0-9\s()-]{7,20}" placeholder="กรอกเบอร์โทรศัพท์"></label><label class="field"><span>วันที่ต้องการจอง</span><input name="travelDate" type="date" required></label><label class="field"><span>เวลา</span><input name="time" type="time" required></label><label class="field"><span>จำนวนผู้โดยสาร</span><input name="passengerCount" type="number" min="1" value="1" step="1" required placeholder="ระบุจำนวนคน"></label><label class="field" style="grid-column:1/-1"><span>หมายเหตุเพิ่มเติม (ถ้ามี)</span><textarea name="notes" rows="3" maxlength="500" placeholder="ระบุข้อมูลเพิ่มเติม (ถ้ามี)"></textarea></label></div><button type="submit" style="margin-top:20px">ยืนยันการจอง</button></form><aside class="panel summary"><h2>สรุปรายการ</h2><img id="boat-image" class="booking-boat-image" alt=""><div class="summary-row"><span>เรือ</span><b id="boat-name">กำลังโหลด…</b></div><div class="summary-row"><span>จำนวนที่นั่งเรือ</span><b id="boat-seats">—</b></div><div class="summary-row"><span>สถานที่ให้บริการ</span><b id="boat-route">—</b></div><div class="summary-row"><span>เวลา</span><b id="trip-time">—</b></div><div class="summary-row"><span>จำนวนผู้โดยสาร</span><b id="passenger-count">1</b></div><div class="summary-row"><span>ราคาเริ่มต้น / คน</span><b id="price-person">—</b></div><div class="summary-row summary-total"><span>ราคารวม</span><b id="total-price">—</b></div></aside></div></main><script src="/js/api.js"></script><script src="/js/booking.js"></script></body></html>
