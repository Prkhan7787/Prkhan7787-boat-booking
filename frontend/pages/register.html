<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก · โบ๊ทลี่</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"></head><body><main class="login-shell"><form id="register-form" class="login-card"><a class="brand" href="/"><span class="brand-mark">⌁</span> boatly</a><span class="eyebrow" style="display:block;margin-top:28px">เริ่มต้นใช้งาน</span><h1 style="font-size:2.2rem;margin:8px 0">สมัครสมาชิก</h1><p>สร้างบัญชีผู้ใช้บริการหรือผู้ให้เช่าเรือ</p><div id="register-error"></div><label class="field"><span>ชื่อ-นามสกุล</span><input name="name" type="text" placeholder="กรอกชื่อและนามสกุล" required minlength="2" maxlength="120" autocomplete="name"></label><label class="field" style="margin-top:14px"><span>อีเมล</span><input name="email" type="email" placeholder="กรอกอีเมล" required autocomplete="email"></label><label class="field" style="margin-top:14px"><span>เบอร์โทรศัพท์</span><input name="phone" type="tel" placeholder="กรอกเบอร์โทรศัพท์" required autocomplete="tel"></label><label class="field" style="margin-top:14px"><span>รหัสผ่าน</span><input name="password" type="password" placeholder="อย่างน้อย 8 ตัวอักษร" required minlength="8" autocomplete="new-password"></label><label class="field" style="margin-top:14px"><span>ยืนยันรหัสผ่าน</span><input name="confirmPassword" type="password" placeholder="กรอกรหัสผ่านอีกครั้ง" required minlength="8" autocomplete="new-password"></label><fieldset class="field" style="border:0;padding:0;margin:18px 0"><legend style="font-weight:700;margin-bottom:10px">สมัครสมาชิกในฐานะ</legend><label><input type="radio" name="role" value="customer" checked> ผู้ใช้บริการ</label><label style="margin-left:18px"><input type="radio" name="role" value="boat_owner"> ผู้ให้เช่าเรือ</label></fieldset><button type="submit" style="width:100%">สมัครสมาชิก</button><p style="text-align:center">มีบัญชีแล้ว? <a href="/pages/login.html">เข้าสู่ระบบ</a></p></form></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
