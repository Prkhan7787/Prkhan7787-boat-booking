<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เพิ่มเรือ · โบ๊ทลี่</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="container navbar"><a class="brand" href="/"><span class="brand-mark">⌁</span> boatly</a><nav class="navlinks"><a href="/pages/history.html">ประวัติการจอง</a></nav><a class="button secondary small" href="/pages/search.html">กลับไปดูเรือ</a></header><section class="page-hero"><div class="container"><span class="eyebrow">เพิ่มเรือในรายการ</span><h1 class="page-title">เพิ่มเรือ</h1><p>กรอกข้อมูลที่จำเป็น เรือจะแสดงในรายการบนอุปกรณ์นี้ทันที</p></div></section><main class="container page-main"><form id="add-boat-form" class="panel"><div id="boat-form-error"></div><div class="form-grid"><label class="field"><span>ชื่อเรือ</span><input name="name" required maxlength="140" placeholder="เช่น เรือสมุทรสุข"></label><label class="field"><span>รูปภาพเรือ (ลิงก์รูปภาพ)</span><input name="image" type="url" placeholder="https://example.com/boat.jpg"></label><label class="field"><span>ประเภทเรือ</span><select name="type" required><option value="">เลือกประเภทเรือ</option><option value="Ferry">เรือเฟอร์รี่</option><option value="Speedboat">เรือสปีดโบ๊ต</option><option value="Longtail">เรือหางยาว</option><option value="Catamaran">เรือคาตามารัน</option></select></label><label class="field"><span>จำนวนที่นั่ง</span><input name="capacity" type="number" min="1" max="2000" step="1" required placeholder="เช่น 20"></label><label class="field"><span>ราคาเริ่มต้นต่อคน (บาท)</span><input name="price" type="number" min="1" step="1" required placeholder="เช่น 950"></label><label class="field"><span>สถานที่ให้บริการ / จุดขึ้นเรือ</span><input name="service_location" required maxlength="160" placeholder="เช่น ท่าเรือภูเก็ต"></label><label class="field"><span>เบอร์โทรศัพท์สำหรับติดต่อ</span><input name="contact_phone" type="tel" required pattern="\+?[0-9\s()-]{7,20}" placeholder="กรอกเบอร์โทรศัพท์"></label><label class="field" style="grid-column:1/-1"><span>รายละเอียดเรือ</span><textarea name="description" rows="4" required maxlength="1000" placeholder="บอกรายละเอียดที่ช่วยให้ผู้โดยสารเลือกเรือได้"></textarea></label></div><div style="display:flex;justify-content:flex-end;gap:12px;margin-top:22px"><a class="button secondary" href="/pages/search.html">ยกเลิก</a><button type="submit">บันทึกข้อมูลเรือ</button></div></form></main><script src="/js/api.js"></script><script src="/js/boat-form.js"></script></body></html>
