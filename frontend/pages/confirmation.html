<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ยืนยันการจอง · โบ๊ทลี่</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="container navbar"><a class="brand" href="/"><span class="brand-mark">⌁</span> boatly</a></header><main class="container page-main"><div class="panel confirmation"><div class="success-icon">✓</div><span class="eyebrow">ทริปเที่ยวทะเลของคุณใกล้เข้ามาแล้ว</span><h1 style="font-size:2.8rem">จองเรือสำเร็จ</h1><p>จองทริปเรียบร้อยแล้ว เก็บข้อมูลยืนยันนี้ไว้ใช้อ้างอิง</p><div class="booking-code" id="booking-code">กำลังโหลดข้อมูลการจอง…</div><div id="booking-details" class="panel" style="text-align:left"></div><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px"><button id="download-booking" class="button secondary">↓ ดาวน์โหลดข้อมูลการจอง</button><a class="button" href="/">กลับหน้าหลัก</a></div></div></main><script src="/js/api.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const code=query('id');document.querySelector('#booking-code').textContent=code||'ไม่พบข้อมูลการจอง';try{const b=await api(`/bookings/${encodeURIComponent(code)}`);const names=b.passengers.map(p=>`${esc(p.first_name)} ${esc(p.last_name)}`).join(', ');document.querySelector('#booking-details').innerHTML=`<div class="summary-row"><span>ผู้โดยสาร</span><b>${names}</b></div><div class="summary-row"><span>เรือ</span><b>${esc(b.boat_name)}</b></div><div class="summary-row"><span>เส้นทาง</span><b>${esc(portLabel(b.departure_port))} → ${esc(portLabel(b.destination))}</b></div><div class="summary-row"><span>วันและเวลา</span><b>${esc(b.travel_date)} · ${esc(b.departure_time)}</b></div><div class="summary-row"><span>จำนวนผู้โดยสาร</span><b>${esc(b.total_passengers)}</b></div><div class="summary-row"><span>ราคารวม</span><b>${money(b.total_price)}</b></div><div class="summary-row"><span>สถานะ</span><b class="status ${esc(b.status)}">${esc(statusLabel(b.status))}</b></div>`;document.querySelector('#download-booking').onclick=()=>{const text=`ข้อมูลยืนยันการจองเรือ\n${b.booking_code}\n${b.boat_name}\n${portLabel(b.departure_port)} ถึง ${portLabel(b.destination)}\nวันที่ ${b.travel_date} เวลา ${b.departure_time}\nผู้โดยสาร ${b.total_passengers} คน\nราคารวม ${money(b.total_price)}\nสถานะ ${statusLabel(b.status)}`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=`${b.booking_code}.txt`;a.click();URL.revokeObjectURL(a.href)}}catch(e){document.querySelector('#booking-details').innerHTML=`<div class="error">${esc(e.message)}</div>`}});
</script></body></html>
