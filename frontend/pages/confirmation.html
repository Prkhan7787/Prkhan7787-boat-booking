<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ยืนยันการจอง · โบ๊ทลี่</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="container navbar"><a class="brand" href="/"><span class="brand-mark">⌁</span> boatly</a><nav class="navlinks"><a href="/">หน้าหลัก</a><a href="/pages/history.html">ประวัติการจอง</a></nav></header><main class="container page-main"><div class="panel confirmation"><div class="success-icon">✓</div><span class="eyebrow">ทริปเที่ยวทะเลของคุณใกล้เข้ามาแล้ว</span><h1 style="font-size:2.8rem">จองเรือสำเร็จ</h1><p>บันทึกข้อมูลยืนยันไว้ในอุปกรณ์เครื่องนี้แล้ว</p><div class="booking-code" id="booking-code">กำลังโหลดข้อมูลการจอง…</div><div id="booking-details" class="panel" style="text-align:left"></div><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px"><button id="download-booking" class="button secondary">↓ ดาวน์โหลดข้อมูลการจอง</button><a class="button secondary" href="/pages/history.html">ดูประวัติการจอง</a><a class="button" href="/pages/search.html">กลับหน้ารายการเรือ</a></div></div></main><script src="/js/api.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
  const code=query('id'),codeNode=document.querySelector('#booking-code'),details=document.querySelector('#booking-details');
  codeNode.textContent=code||'ไม่พบข้อมูลการจอง';
  try{
    const b=await api(`/bookings/${encodeURIComponent(code)}`);
    details.innerHTML=`<img class="confirmation-boat-image" src="${esc(b.boatImage)}" alt="${esc(b.boatName)}"><div class="summary-row"><span>หมายเลขการจอง</span><b>${esc(b.bookingNumber||b.id)}</b></div><div class="summary-row"><span>ชื่อผู้จอง</span><b>${esc(b.customerName)}</b></div><div class="summary-row"><span>เบอร์โทรศัพท์</span><b>${esc(b.phone)}</b></div><div class="summary-row"><span>เรือ</span><b>${esc(b.boatName)}</b></div><div class="summary-row"><span>วันที่และเวลา</span><b>${esc(b.bookingDate)} · ${esc(b.bookingTime)}</b></div><div class="summary-row"><span>จำนวนผู้โดยสาร</span><b>${esc(b.passengerCount)} คน</b></div><div class="summary-row"><span>หมายเหตุ</span><b>${esc(b.note||'ไม่มี')}</b></div><div class="summary-row"><span>ราคารวม</span><b>${money(Number(b.price)*Number(b.passengerCount))}</b></div>`;
    document.querySelector('#download-booking').onclick=()=>{const text=`ข้อมูลยืนยันการจองเรือ\n${b.bookingNumber||b.id}\nผู้จอง ${b.customerName}\nโทร ${b.phone}\n${b.boatName}\nวันที่ ${b.bookingDate} เวลา ${b.bookingTime}\nผู้โดยสาร ${b.passengerCount} คน\nราคารวม ${money(Number(b.price)*Number(b.passengerCount))}`;const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));link.download=`${b.bookingNumber||b.id}.txt`;link.click();URL.revokeObjectURL(link.href)};
  }catch(error){details.innerHTML=`<div class="error">${esc(error.message)}</div>`}
});
</script></body></html>
