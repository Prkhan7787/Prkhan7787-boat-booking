<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เพิ่มเรือ · โบ๊ทลี่</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand" href="/"><span class="brand-mark">⌁</span> boatly</a><a href="/owner/index.html">▦ &nbsp; แดชบอร์ด</a><a href="/owner/boats.html">⚓ &nbsp; เรือของฉัน</a><a class="active" href="/owner/add-boat.html">＋ &nbsp; เพิ่มเรือ</a><a href="/owner/bookings.html">▤ &nbsp; การจองเรือ</a><a href="/owner/profile.html">♙ &nbsp; โปรไฟล์</a><a href="/" style="margin-top:auto">↗ &nbsp; ดูหน้าเว็บไซต์</a></aside><main class="admin-content"><div class="admin-top"><div><span class="eyebrow">ข้อมูลเรือ</span><h1 id="owner-form-title" style="font-size:2.2rem;margin:5px 0">เพิ่มเรือ</h1></div><button class="button secondary small" data-logout>ออกจากระบบ</button></div><div id="owner-error"></div><form id="owner-boat-form" class="admin-card"><input type="hidden" name="id"><div class="admin-form"><label class="field"><span>ชื่อเรือ</span><input name="name" required placeholder="เช่น เรือสมุทรสุข"></label><label class="field"><span>ประเภทเรือ</span><select name="type" required><option value="Ferry">เรือเฟอร์รี่</option><option value="Speedboat">เรือสปีดโบ๊ต</option><option value="Longtail">เรือหางยาว</option><option value="Catamaran">เรือคาตามารัน</option></select></label><label class="field"><span>รายละเอียดเรือ</span><input name="description" required placeholder="บอกจุดเด่นของเรือ"></label><label class="field"><span>ลิงก์รูปภาพเรือ</span><input name="image" type="url" required placeholder="https://example.com/boat.jpg"></label><label class="field"><span>จุดขึ้นเรือ</span><select name="departure_port" required><option value="Phuket">ภูเก็ต</option><option value="Krabi">กระบี่</option><option value="Koh Samui">เกาะสมุย</option></select></label><label class="field"><span>ปลายทาง</span><select name="destination" required><option value="Phi Phi Islands">หมู่เกาะพีพี</option><option value="Koh Lanta">เกาะลันตา</option><option value="Koh Tao">เกาะเต่า</option><option value="Krabi">กระบี่</option></select></label><label class="field"><span>จำนวนผู้โดยสารสูงสุด</span><input name="capacity" type="number" min="1" required placeholder="เช่น 20"></label><label class="field"><span>ความเร็ว</span><input name="speed" required placeholder="เช่น 28 นอต"></label><label class="field"><span>ราคา</span><input name="price" type="number" min="1" required placeholder="ราคาต่อคน"></label><label class="field"><span>วันที่ให้บริการ</span><input name="service_date" type="date" required></label><label class="field"><span>เวลาออกเดินทาง</span><input name="departure_time" type="time" required></label><label class="field"><span>เวลาถึง</span><input name="arrival_time" type="time" required></label><label class="field"><span>ระยะเวลาเดินทาง</span><input name="duration" required placeholder="เช่น 1 ชม. 30 นาที"></label><label class="field"><span>เบอร์ติดต่อ</span><input name="contact_phone" type="tel" required placeholder="กรอกเบอร์โทรศัพท์"></label><label class="field"><span>สิ่งอำนวยความสะดวก</span><input name="amenities" placeholder="เช่น เสื้อชูชีพ, น้ำดื่ม"></label><label class="field"><span>สถานะ</span><select name="status"><option value="active">เปิดให้บริการ</option><option value="inactive">ปิดให้บริการ</option></select></label></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><a class="button secondary" href="/owner/boats.html">ยกเลิก</a><button id="owner-save" type="submit">เพิ่มเรือ</button></div></form></main></div><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/owner.js"></script></body></html>
