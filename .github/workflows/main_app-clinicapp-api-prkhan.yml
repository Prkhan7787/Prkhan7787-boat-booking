# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - app-clinicapp-api-prkhan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Prepare Azure deployment package
        run: |
          mkdir deploy-package

          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='deploy-package' \
            ./ deploy-package/

          cat > deploy-package/package.json <<'EOF'
          {
            "name": "boat-booking-app",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node backend/server.js"
            },
            "engines": {
              "node": ">=18"
            },
            "dependencies": {
              "bcryptjs": "^2.4.3",
              "cors": "^2.8.5",
              "dotenv": "^16.4.7",
              "express": "^4.21.2",
              "helmet": "^8.0.0",
              "jsonwebtoken": "^9.0.2",
              "pg": "^8.13.1"
            }
          }
          EOF

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8E360ED7F7A34B39865DA5DCEBA086C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_816BB031843745ABA6150B4C00197082 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A6D119632A55460FBE55A81B7CD29072 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-clinicapp-api-prkhan'
          slot-name: 'Production'
          package: .
